<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding:0;
        box-sizing: border-box;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;

    }
    body{
        width: 100%;
        height: 90%;
        padding:50px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(45deg, #000000);


    }
    .container{
        border: 1px solid #717377;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0px 3px 15px rgba(113,115,119,0.5);
    }
    input{
        width:320px;
        border: none;
        padding: 24px;
        margin: 10px;
        background: transparent;
        box-shadow: 0px 3px 15px rgbs(84,84,84,0.1);
        font-size:40px;
        text-align: right;
        cursor: pointer;
        color: white;
    }
    input::placeholder{
        color: white;
    }

    button{
        border: none;
        width: 60px;
        height: 60px;
        margin: 10px;
        border-radius: 50%;
        background:transparent ;
        color: #ffffff;
        font-size: 20px;
        box-shadow: -8px -8px 15px  rgba(255,255,255, 0.1 );
        cursor:pointer;
    }
    .equalBtn{
        background-color: orange;
    }
    .operatorBtn{
        color: aquamarine;
    }

</style>
<body>
    <div class="container">
        <input type="text" placeholder="0" id="inputBox">
        <div>
            <button class="operatorBtn">AC</button>
            <button class="operatorBtn">DEL</button>
            <button class="operatorBtn">%</button>
            <button class="operatorBtn">/</button>
        </div>

        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operatorBtn">*</button>
        </div>

        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operatorBtn">-</button>
        </div>

        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operatorBtn">+</button>
        </div>
        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equalBtn">=</button>
        </div>
    </div>

   

    <script>
    let input = document.getElementById('inputBox'); // Access input box
    let buttons = document.querySelectorAll('button'); // All button select
    let string = ""; // Store result
    let arr = Array.from(buttons);

    arr.forEach(button => {
        button.addEventListener('click', (e) => {
            let btn = e.target.innerHTML;

            if (btn === "=") {
                try {
                    string = eval(string);
                    input.value = string;
                } catch {
                    input.value = "Error";
                    string = "";
                }
            } else if (btn === 'AC') {
                string = "";
                input.value = string;
            } else if (btn === "DEL") {
                string = string.substring(0, string.length - 1);
                input.value = string;

               

            } else if (btn === "%") {
             string = string + "/100";
            input.value = string;
            }
            
             else {
                string += btn;
                input.value = string;
            }
        });
    });
</script>

</body>
</html>
